name: kids_care
description: "Kids Care - Child location tracking and notification app for parents."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Data classes
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.15.2
  firebase_messaging: ^15.1.0
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.7.0

  # Location & Geofencing
  geolocator: ^13.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geofencing_api: ^2.0.0

  # Voice/Video Calling — disabled for first release (no camera/mic permissions).
  # Re-enable together with lib/providers/zego_service.dart (moved to docs/disabled/).
  # zego_uikit: ^2.28.44
  # zego_uikit_prebuilt_call: ^4.22.3
  # zego_uikit_signaling_plugin: ^2.8.20

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  flutter_svg: ^2.3.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.15.1
  freezed: ^3.2.0
  json_serializable: ^6.14.0

  # Testing
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/icons/app/app_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#FFF3E0"
  adaptive_icon_foreground: "assets/icons/app/app_icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app/app_icon.png"
    background_color: "#FFF3E0"
    theme_color: "#FF8C00"
